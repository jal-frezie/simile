<P CLASS="msonormal"><A NAME="leastfunction"></A><SPAN LANG="en-GB"><B>least</B></SPAN>
<SPAN LANG="en-GB">function</SPAN></P>
<P CLASS="msonormal">&nbsp;</P>
<P LANG="en-GB" CLASS="msonormal"><B>least([X])<BR>least({X})</B></P>
<P LANG="en-GB" CLASS="msonormal">Returns the smallest value from an
array [X] or the list {X}</P>
<P CLASS="msonormal">&nbsp;</P>
<P CLASS="msonormal"><SPAN LANG="en-GB"><B>Inputs</B></SPAN><SPAN LANG="en-GB">:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
numeric array/list</SPAN></P>
<P CLASS="msonormal"><SPAN LANG="en-GB"><B>Result</B></SPAN><SPAN LANG="en-GB">:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
numeric</SPAN></P>
<P CLASS="msonormal">&nbsp;</P>
<P CLASS="msonormal"><SPAN LANG="en-GB"><B>Example</B></SPAN><SPAN LANG="en-GB">:</SPAN></P>
<P LANG="en-GB" CLASS="msonormal">least([2,5,7,3]) --&gt; 2</P>
<P CLASS="msonormal">&nbsp;</P>
